<nav class="fixed inset-x-0 top-0 z-50 px-3 pt-3 sm:px-5" aria-label="Navegación principal">
  <div
    class="glass-strong mx-auto max-w-7xl rounded-2xl transition-all duration-500"
    [class]="scrolled() ? '!bg-night/85 shadow-[0_18px_50px_-18px_rgba(0,0,0,0.75)]' : ''">
    <div class="flex h-14 items-center justify-between gap-4 px-3 sm:px-4">

      <!-- Logo -->
      <a routerLink="/" class="group flex shrink-0 items-center gap-2" aria-label="Piña Palmera — inicio">
        <span class="relative flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-brand-yellow to-brand-orange text-lg shadow-[0_0_20px_rgba(232,212,77,0.35)] transition-transform duration-300 group-hover:rotate-[-8deg] group-hover:scale-105">
          🍍
        </span>
        <span class="font-pacifico text-xl text-brand-yellow sm:text-2xl">Piña Palmera</span>
      </a>

      <!-- Desktop nav links -->
      <div class="hidden items-center gap-1 rounded-xl border border-white/5 bg-white/[0.03] p-1 lg:flex">
        @for (link of links; track link.path) {
          <a [routerLink]="link.path"
             routerLinkActive="!bg-white/10 !text-brand-yellow"
             class="rounded-lg px-3.5 py-1.5 font-nunito text-sm font-semibold text-white/70 transition-colors duration-200 hover:bg-white/5 hover:text-white">
            {{ link.label }}
          </a>
        }
        <a routerLink="/calaverandia"
           routerLinkActive="!bg-brand-orange !text-night"
           class="ml-1 inline-flex items-center gap-1.5 rounded-lg border border-brand-orange/40 bg-brand-orange/10 px-3 py-1.5 font-nunito text-xs font-bold text-brand-orange transition-all duration-200 hover:bg-brand-orange hover:text-night">
          💀 Calaverandia
        </a>
      </div>

      <!-- CTA: Teléfono + Pedido -->
      <div class="hidden items-center gap-2 lg:flex">
        <a href="tel:3318041630"
           class="flex items-center gap-1.5 whitespace-nowrap rounded-lg px-3 py-2 font-nunito text-sm font-semibold text-white/75 transition-colors duration-200 hover:text-brand-yellow">
          <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"/>
          </svg>
          33 1804 1630
        </a>
        <button type="button" (click)="sidebar.open()"
                class="group relative inline-flex items-center gap-2 overflow-hidden whitespace-nowrap rounded-xl bg-brand-yellow px-5 py-2.5 font-nunito text-sm font-extrabold text-night shadow-[0_0_24px_rgba(232,212,77,0.35)] transition-all duration-300 hover:shadow-[0_0_36px_rgba(232,212,77,0.6)]">
          <span class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/60 to-transparent transition-transform duration-700 group-hover:translate-x-full" aria-hidden="true"></span>
          <svg class="relative h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M3.75 5.25h1.386a1.5 1.5 0 011.474 1.223l.267 1.527m0 0h11.873a1.5 1.5 0 011.474 1.777l-.774 4.5a1.5 1.5 0 01-1.478 1.223H9.22a1.5 1.5 0 01-1.478-1.223L6.877 8.25zm2.123 10.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm9 0a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"/>
          </svg>
          <span class="relative">Pedir ahora</span>
        </button>
      </div>

      <!-- Mobile: botón pedido + hamburger -->
      <div class="flex items-center gap-2 lg:hidden">
        <button type="button" (click)="sidebar.open()"
                class="rounded-xl bg-brand-yellow px-3.5 py-2 font-nunito text-xs font-extrabold text-night shadow-[0_0_18px_rgba(232,212,77,0.35)]">
          🛒 Pedido
        </button>
        <button type="button" (click)="toggleMenu()"
                class="flex h-10 w-10 items-center justify-center rounded-xl border border-white/10 bg-white/5 text-white transition-colors hover:bg-white/10"
                [attr.aria-expanded]="menuOpen()"
                aria-controls="menu-movil"
                [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'">
          @if (menuOpen()) {
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          } @else {
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7h16M4 12h16M4 17h10"/>
            </svg>
          }
        </button>
      </div>

    </div>

    <!-- Mobile menu -->
    @if (menuOpen()) {
      <div id="menu-movil" class="flex flex-col gap-1 border-t border-white/10 px-3 pb-4 pt-3 lg:hidden">
        @for (link of links; track link.path) {
          <a [routerLink]="link.path" (click)="closeMenu()"
             routerLinkActive="!bg-white/10 !text-brand-yellow"
             class="flex items-center gap-3 rounded-xl px-3 py-2.5 font-nunito font-semibold text-white/80 transition-colors hover:bg-white/5 hover:text-brand-yellow">
            <span class="text-lg" aria-hidden="true">{{ link.icon }}</span>
            {{ link.labelLargo }}
          </a>
        }
        <a routerLink="/calaverandia" (click)="closeMenu()"
           class="mt-1 flex items-center gap-2 rounded-xl border border-brand-orange/30 bg-brand-orange/10 px-3 py-2.5 font-nunito font-bold text-brand-orange transition-colors hover:bg-brand-orange/20">
          💀 Calaverandia 2025
        </a>
        <a href="tel:3318041630" class="mt-2 rounded-xl border border-white/10 px-3 py-2.5 font-nunito font-semibold text-brand-yellow">
          📞 33 1804 1630
        </a>
      </div>
    }
  </div>
</nav>
