<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="848" viewBox="0 0 1200 848" role="img" aria-labelledby="title3"><title id="title3">Piña Palmera · Infraestructura · Página 3</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#247448" stroke-width="1.6"/></marker></defs><rect width="1200" height="848" fill="#F6F8F2"/><rect width="1200" height="8" fill="#247448"/><text x="52" y="53" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#247448">PIÑA PALMERA</text><text x="52" y="103" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#183D2D">Protección, integraciones y operación</text><text x="52" y="133" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#607569">La infraestructura sostiene las ventas, los cobros, la facturación y el seguimiento de eventos.</text><rect x="947" y="31" width="201" height="27" rx="13" fill="#E8F0E3" stroke="none"/><text x="959" y="49" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#247448">OPERACIÓN Y CONTINUIDAD</text><path d="M52 783H1148" stroke="#D4E0D5"/><text x="52" y="812" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#607569">INFRAESTRUCTURA · 02 NOV 2026</text><text x="950" y="812" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#247448">03 / 03</text><rect x="52" y="169" width="529" height="300" rx="16" fill="#FFFFFF" stroke="#D4E0D5"/><text x="72" y="202" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#183D2D">Integraciones del negocio</text><text x="73" y="240" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#247448">Stripe</text><text x="73" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#607569">Cobros y reembolsos desde Payments.</text><text x="73" y="284" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#247448">Facturapi</text><text x="73" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#607569">CFDI y varios RFC emisores desde Billing.</text><text x="73" y="328" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#247448">Correo SMTP</text><text x="73" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#607569">Notificaciones mediante el proveedor configurado.</text><text x="73" y="372" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#247448">Mapbox</text><text x="73" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#607569">Mapa público del punto de recolección.</text><text x="73" y="416" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#247448">WhatsApp / Meta</text><text x="73" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#607569">Consentimiento y cola preparados; envío pendiente.</text><rect x="611" y="169" width="537" height="300" rx="16" fill="#FFFFFF" stroke="#D4E0D5"/><text x="632" y="202" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#183D2D">Seguridad y recuperación</text><text x="632" y="240" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#247448">Acceso por rol y RFC</text><text x="632" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#607569">Sesiones y permisos validados en el servicio dueño.</text><text x="632" y="284" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#247448">Datos separados por dominio</text><text x="632" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#607569">Usuarios de base con acceso limitado.</text><text x="632" y="328" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#247448">Comunicación interna firmada</text><text x="632" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#607569">Firmas Ed25519 y protección contra repetición.</text><text x="632" y="372" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#247448">Credenciales fuera de Git</text><text x="632" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#607569">Archivos privados en local; secretos Swarm en producción.</text><text x="632" y="416" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#247448">Copias cifradas</text><text x="632" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#607569">Retención: 14 diarias, 8 semanales y 12 mensuales.</text><rect x="52" y="492" width="529" height="139" rx="16" fill="#E8F0E3" stroke="#D4E0D5"/><text x="72" y="524" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#183D2D">Publicación y cambios</text><text x="72" y="552" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#607569">GitHub verifica el código y permite publicar imágenes</text><text x="72" y="575" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#607569">con versión identificada por commit. Los scripts de Swarm</text><text x="72" y="598" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#607569">validan el entorno antes del despliegue en producción.</text><rect x="611" y="492" width="537" height="139" rx="16" fill="#E8F0E3" stroke="#D4E0D5"/><text x="632" y="524" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#183D2D">Monitoreo y alertas</text><text x="632" y="552" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#607569">Once sondas de disponibilidad y control de frescura</text><text x="632" y="575" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#607569">del respaldo. Registros Docker con rotación. El envío</text><text x="632" y="598" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#607569">de alertas externas requiere configurar su destinatario.</text><rect x="52" y="653" width="1096" height="101" rx="14" fill="#FFF6DE" stroke="#E8D7A6"/><text x="72" y="683" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#8A631C">OBSERVACIÓN OPERATIVA · 02 NOV 2026</text><text x="72" y="710" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8A631C">Las aplicaciones locales reportan operación normal. El servicio de respaldo presenta una alerta de salud</text><text x="72" y="734" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8A631C">al generar este documento; revisar su última ejecución. Producción todavía no está desplegada.</text></svg>