13" font-weight="400" fill="#607569">Alertmanager</text><rect x="892" y="613" width="256" height="96" rx="16" fill="#FFFFFF" stroke="#D4E0D5"/><text x="907" y="642" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#183D2D">Respaldos</text><text x="907" y="667" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#607569">Copias cifradas con restic</text><text x="907" y="687" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#607569">Retención y restauración</text><text x="52" y="603" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#247448">CAPACIDADES COMPARTIDAS</text><text x="52" y="741" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#607569">15 servicios en Compose. PostgreSQL, Redis y NATS conservan sus contenedores y datos existentes.</text><text x="52" y="763" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#607569">El WebSocket recibe eventos de NATS; las seis bases son independientes a nivel lógico, no seis servidores.</text></svg>